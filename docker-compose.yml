services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: field-reports-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CHAOS_ENABLED=false
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
